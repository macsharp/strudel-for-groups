<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Coding Platform</title>
    <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
    <script src="https://unpkg.com/codeflask/build/codeflask.min.js"></script>

<body>

<div id="welcomeView">
    <h1>Welcome to Synced-Strudel!</h1>

    <div class="userInfoSection">
        <label for="usernameInput">Enter your name:</label>
        <input type="text" id="usernameInput" placeholder="Your name" />
    </div>
    <div class="startingActions">
        <div class="actionItemBtn createNew">
            <h2>Start a new session</h2>
            <p>and others can join you</p>
        </div>

        <div class="actionItemBtn">
            <h2>Join an existing session</h2>
            <label for="sessionCodeInput">Enter session code:</label>
            <input type="text" id="sessionCodeInput" placeholder="e.g. 7F3K-9Q2L" />
            <button id="joinSessionBtn">Join</button>
        </div>
    </div>
</div>

<div id="container">
    <div id="topBar">
        <button id="returnBtn">Return</button>

        <input type="text" id="sessionTitleInput" placeholder="Session Title" value="Untitled Session" />

        <div id="controlButtons">
            <button id="startPlaybackBtn">Start</button>
            <button id="stopPlaybackBtn">Stop</button>
        </div>
    </div>
